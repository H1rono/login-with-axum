name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      db:
        # see /docker/compose.yml
        image: mariadb:latest
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_USER: db
          MARIADB_PASSWORD: password
          MARIADB_DATABASE: db
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "healthcheck.sh --su-mysql --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 5s
          --health-retries 5
    env:
      DATABASE_URL: mysql://db:password@localhost:3306/db
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
      - run: |
          brew install sqlx-cli
          cargo sqlx database setup
          cargo check
          cargo sqlx prepare --check
          cargo build
          cargo clippy -- -D warnings
          cargo fmt --all -- --check

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno install --frozen --node-modules-dir=manual
      - run: deno fmt --check
      - run: deno lint client
      - run: deno task --frozen --node-modules-dir=manual build

  ghcr-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: setup-buildx
        uses: docker/setup-buildx-action@v4
      - id: cache
        uses: actions/cache@v6
        with:
          path: cache-mount
          key: cache-mount-${{ hashFiles('docker/Dockerfile') }}
      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: cache-mount
          dockerfile: ./docker/Dockerfile
          # skip-extraction: ${{ steps.cache.outputs.cache-hit }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push-image-name
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "value=ghcr.io/${REPO@L}" >> $GITHUB_OUTPUT
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.push-image-name.outputs.value }}
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          provenance: false
          file: ./docker/Dockerfile
          push: ${{ github.ref_name == 'main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64,linux/amd64,linux/ppc64le,linux/s390x
          cache-from: type=registry,ref=${{ steps.push-image-name.outputs.value }}:cache-latest
          cache-to: type=registry,ref=${{ steps.push-image-name.outputs.value }}:cache-latest,mode=max
